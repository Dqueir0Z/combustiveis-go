name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # O Docker já vem no runner ubuntu-latest; o Testcontainers sobe o PostgreSQL 16 sozinho.
      - name: Testes
        run: ./gradlew test --console=plain
